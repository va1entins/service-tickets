# Konfiguracja stosu Docker dla projektu Symfony + API Platform
# Usługi: PHP-FPM 8.3, Nginx, PostgreSQL, Redis, Messenger Worker

services:

  # --- PHP-FPM 8.3 ---
  php:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: service_tickets_php
    restart: unless-stopped
    volumes:
      - .:/var/www/service-tickets
      - ./docker/php/php.ini:/usr/local/etc/php/conf.d/custom.ini:ro
    environment:
        APP_ENV: ${APP_ENV:-dev}
        DATABASE_URL: "postgresql://app:secret@postgres:5432/service_tickets?serverVersion=16&charset=utf8"
    networks:
      - app_network
    depends_on:
      - postgres
      - redis

  # --- Nginx ---
  nginx:
    image: nginx:1.25-alpine
    container_name: service_tickets_nginx
    restart: unless-stopped
    ports:
      - "${NGINX_PORT:-8080}:80"
    volumes:
      - .:/var/www/service-tickets:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - app_network
    depends_on:
      - php

  # --- PostgreSQL ---
  postgres:
    image: postgres:16-alpine
    container_name: service_tickets_postgres
    restart: unless-stopped
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-service_tickets}
      POSTGRES_USER: ${POSTGRES_USER:-app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-secret}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - app_network

  # --- Redis ---
  redis:
    image: redis:7-alpine
    container_name: service_tickets_redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    networks:
      - app_network

  # --- Symfony Messenger Worker ---
  messenger:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: service_tickets_messenger
    restart: unless-stopped
    command: php bin/console messenger:consume async --time-limit=3600 --memory-limit=128M -vv
    volumes:
      - .:/var/www/service-tickets
      - ./docker/php/php.ini:/usr/local/etc/php/conf.d/custom.ini:ro
    environment:
        APP_ENV: ${APP_ENV:-dev}
        DATABASE_URL: "postgresql://app:secret@postgres:5432/service_tickets?serverVersion=16&charset=utf8"
    networks:
      - app_network
    depends_on:
      - postgres
      - redis

# --- Wolumeny trwałe ---
volumes:
  postgres_data:
  redis_data:

# --- Sieć wewnętrzna ---
networks:
  app_network:
    driver: bridge
