# Konfiguracja Nginx dla projektu Symfony

server {
    listen 80;
    server_name _;

    # Katalog główny projektu Symfony (public/)
    root /var/www/service-tickets/public;
    index index.php;

    # Obsługa żądań — najpierw plik statyczny, potem Symfony front controller
    location / {
        try_files $uri $uri/ /index.php$is_args$args;
    }

    # Przekazanie żądań PHP do PHP-FPM
    location ~ ^/index\.php(/|$) {
        fastcgi_pass php:9000;
        fastcgi_split_path_info ^(.+\.php)(/.*)$;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        # Zapobieganie podwójnej obsłudze żądań
        internal;
    }

    # Blokada dostępu do pozostałych plików .php
    location ~ \.php$ {
        return 404;
    }

    # Logi
    error_log  /var/log/nginx/error.log;
    access_log /var/log/nginx/access.log;
}
