security:
    password_hashers:
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: 'auto'

    providers:
        users_in_memory:
            memory:
                users:
                    admin:
                        password: '$2y$13$o5iLpGXxnMDtE2tfomcZFeu9S4.haj7KfQxwd2XZxNYj9HtD3SETK'
                        roles: [ 'ROLE_ADMIN' ]
                    tech1:
                        password: '$2y$13$rru60lKtV95yFcRVSlIdQuJi4vkWr69HPdUVHI9Y/tJrYlZU08lmC'
                        roles: [ 'ROLE_TECHNICIAN' ]

    firewalls:
        dev:
            pattern: ^/(_profiler|_wdt|assets|build)/
            security: false
        api:
            pattern: ^/api/
            stateless: true
            provider: users_in_memory
            http_basic:
                realm: "Service Tickets API"
        main:
            lazy: true
            stateless: true
            provider: users_in_memory

    access_control:
        - { path: ^/api/docs, roles: PUBLIC_ACCESS }
        - { path: ^/api/, roles: IS_AUTHENTICATED_FULLY }

when@test:
    security:
        password_hashers:
            Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface:
                algorithm: auto
                cost: 4
                time_cost: 3
                memory_cost: 10
